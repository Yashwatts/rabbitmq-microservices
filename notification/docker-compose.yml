services:
  notification:
    build:
      context: .
      dockerfile: Dockerfile
      target: development

    container_name: notification
    ports:
      - '3001:3001'
    volumes:
      - .:/app
      # - notification_node_modules:/app/node_modules
    # environment:
    #   CHOKIDAR_USEPOLLING: "true"
    env_file:
      - .env
    networks:
      - backend

# volumes:
#   notification_node_modules:
networks:
  backend:
    external: true
